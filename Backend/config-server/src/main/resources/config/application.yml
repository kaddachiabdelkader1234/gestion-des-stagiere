# Common configuration for all Spring services
# This file is served by Config Server

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${HOSTNAME:${COMPUTERNAME:localhost}}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Common error handling
server:
  error:
    include-message: always
    include-binding-errors: always

# Disable Spring Cloud compatibility verifier
spring:
  cloud:
    compatibility-verifier:
      enabled: false
