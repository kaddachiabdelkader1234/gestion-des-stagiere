<div class="max-w-3xl mx-auto space-y-6 animate-fade-in">
  <!-- Header -->
  <div class="bg-white rounded-2xl shadow-card border border-gray-100 p-6">
    <div class="flex items-center gap-4">
      <div class="w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center">
        <span class="material-icons text-primary text-2xl">notifications</span>
      </div>
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Notifications</h1>
        <p class="text-sm text-gray-500">Vos alertes et notifications récentes</p>
      </div>
    </div>
  </div>

  <!-- Loading -->
  <div *ngIf="isLoading" class="bg-white rounded-2xl shadow-card border border-gray-100 p-12 text-center">
    <div class="animate-spin w-8 h-8 border-4 border-primary border-t-transparent rounded-full mx-auto"></div>
    <p class="text-gray-500 mt-4">Chargement...</p>
  </div>

  <!-- Error -->
  <div *ngIf="errorMessage && !isLoading" class="bg-red-50 border border-red-200 rounded-2xl p-6 text-red-600">
    {{ errorMessage }}
  </div>

  <!-- Empty state -->
  <div *ngIf="!isLoading && !errorMessage && notifications.length === 0"
       class="bg-white rounded-2xl shadow-card border border-gray-100 p-12 text-center">
    <span class="material-icons text-gray-300 text-5xl">notifications_none</span>
    <p class="text-gray-500 mt-4">Aucune notification pour le moment.</p>
  </div>

  <!-- Notification list -->
  <div *ngIf="!isLoading && notifications.length > 0" class="space-y-3">
    <div *ngFor="let n of notifications"
         (click)="markAsRead(n)"
         class="bg-white rounded-xl shadow-card border border-gray-100 p-4 cursor-pointer transition-all duration-200 hover:shadow-md"
         [class.opacity-60]="n.lu"
         [class.border-l-4]="!n.lu"
         [class.border-l-primary]="!n.lu">

      <div class="flex items-start gap-3">
        <!-- Icon -->
        <div class="flex-shrink-0 w-10 h-10 rounded-xl flex items-center justify-center"
             [ngClass]="getTypeColor(n.type)">
          <span class="material-icons text-lg">{{ getTypeIcon(n.type) }}</span>
        </div>

        <!-- Content -->
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-1">
            <span class="text-sm font-semibold text-gray-800">{{ getTypeLabel(n.type) }}</span>
            <span *ngIf="!n.lu" class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
          </div>
          <p class="text-sm text-gray-600">{{ n.message }}</p>
          <p class="text-xs text-gray-400 mt-1">{{ n.dateCreation | date:'dd/MM/yyyy HH:mm' }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
